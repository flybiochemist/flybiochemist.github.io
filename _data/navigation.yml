# The following is the order of the links in the header of the website.
#
# Changing the order here will adjust the order and you can also add additional
# links. Removing a link prevents it from showing in the header, but does not
# prevent it from being included in the site.
#
# NOTE the site title in the masthead already links to the About page (/),
#      so there is no separate "About" entry here.
#
# main_ko is the Korean counterpart, selected in _includes/masthead.html when a
# page declares lang: ko. Pages without a Korean translation stay in English.

main:
  - title: "Projects"
    url: /projects/

  - title: "Publications"
    url: /publications/

  - title: "Blog"
    url: /year-archive/

  - title: "CV"
    url: /cv/

main_ko:
  - title: "연구"
    url: /ko/projects/

  - title: "논문"
    url: /publications/

  - title: "블로그"
    url: /year-archive/

  - title: "CV"
    url: /ko/cv/
